<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#10B981" stroke-width="6" />
  
  <!-- Left Speech Bubble (WeChat Green) -->
  <g transform="translate(75, 95)">
    <rect width="230" height="180" rx="58" fill="url(#emeraldGrad)" />
    <polygon points="50,170 20,240 100,175" fill="url(#emeraldGrad)" />
    <circle cx="75" cy="90" r="11" fill="#FFFFFF" opacity="0.95" />
    <circle cx="115" cy="90" r="11" fill="#FFFFFF" opacity="0.95" />
    <circle cx="155" cy="90" r="11" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Right Speech Bubble (DingTalk Cyan) -->
  <g transform="translate(195, 205)">
    <rect width="230" height="180" rx="58" fill="url(#cyanGrad)" fill-opacity="0.95" stroke="#E0F2FE" stroke-width="2" />
    <polygon points="175,170 205,240 125,175" fill="url(#cyanGrad)" />
    <line x1="70" y1="90" x2="160" y2="90" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="85" y1="68" x2="145" y2="68" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="85" y1="112" x2="145" y2="112" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Golden AI Nexus Star -->
  <g transform="translate(235, 225)">
    <circle cx="15" cy="15" r="32" fill="url(#aiGrad)" opacity="0.95" filter="url(#glow)" />
    <path d="M15,-8 L20,8 L36,15 L20,22 L15,38 L10,22 L-6,15 L10,8 Z" fill="#FFFFFF" />
  </g>
</svg>
