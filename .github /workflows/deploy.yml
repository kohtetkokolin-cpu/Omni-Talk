name: Deploy OmniTalk to GitHub Pages

# Generates the real firebase-config.js from firebase-config.template.js +
# repo Secrets (so the real key never lives in git history), then deploys
# everything to GitHub Pages.
#
# ⚠️ SETUP REQUIRED before this works:
# 1. Settings → Secrets and variables → Actions → "New repository secret"
#    — add each of these EXACT names (values from Firebase Console →
#    Project Settings → General → Your apps → Web app):
#      FIREBASE_API_KEY
#      FIREBASE_AUTH_DOMAIN
#      FIREBASE_PROJECT_ID
#      FIREBASE_STORAGE_BUCKET
#      FIREBASE_MESSAGING_SENDER_ID
#      FIREBASE_APP_ID
#    (If you already added secrets under different names, either rename
#    them to match these, or edit the "sed" step below to match yours.)
# 2. Settings → Pages → "Build and deployment" → Source → change from
#    "Deploy from a branch" to "GitHub Actions"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate firebase-config.js from template + Secrets
        run: |
          sed \
            -e "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" \
            -e "s|__FIREBASE_AUTH_DOMAIN__|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|__FIREBASE_PROJECT_ID__|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|__FIREBASE_STORAGE_BUCKET__|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            -e "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g" \
            firebase-config.template.js > firebase-config.js

      - name: Sanity-check the generated file isn't still full of placeholders
        run: |
          if grep -q "__FIREBASE_" firebase-config.js; then
            echo "::error::One or more Firebase secrets are missing or misnamed — check Settings → Secrets and variables → Actions against the exact names listed at the top of this workflow file"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check everything before publishing
        run: |
          set -e
          for f in app.js data.js i18n.js firebase-chat.js firebase-config.js service-worker.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
